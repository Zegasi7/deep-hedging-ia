name: Build APK (Compta Facture Maroc)

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "ComptaFactureMaroc/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: ComptaFactureMaroc
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComptaFactureMaroc-debug-apk
          path: ComptaFactureMaroc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
